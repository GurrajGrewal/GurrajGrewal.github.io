<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home - Gurraj Grewal</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon.png">

    <style>

        /* ── RESET ── */
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: #080808;
            color: white;
            overflow-x: hidden;
        }

        /* ── NAVBAR ── */
        .navbar {
            position: absolute;
            top: 0;
            width: 100%;
            z-index: 10;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .nav-center {
            display: flex;
            gap: 10px;
            list-style: none;
            margin: 0;
            padding: 10px 20px;
        }

        .nav-center li a {
            display: inline-block;
            padding: 10px 16px;
            border-radius: 999px;
            color: white;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .nav-center li a:hover { background: rgba(255,255,255,0.2); }
        .nav-center li a[href="home.html"] { background: rgba(255,255,255,0.3); }

        /* ══════════════════════════════════════
           HERO
        ══════════════════════════════════════ */
        .hero {
            position: relative;
            height: 90vh;
            min-height: 600px;
            overflow: hidden;
        }

        .hero-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
            transform: scale(1.05);
            animation: heroZoom 12s ease-out forwards;
        }

        @keyframes heroZoom {
            to { transform: scale(1); }
        }

        /* Rich layered gradient */
        .hero-overlay {
            position: absolute;
            inset: 0;
            background:
                linear-gradient(to top, #080808 0%, rgba(8,8,8,0.65) 30%, transparent 65%),
                linear-gradient(to right, rgba(8,8,8,0.5) 0%, transparent 50%);
        }

        .hero-content {
            position: absolute;
            bottom: 60px;
            left: 72px;
            z-index: 2;
        }

        .hero-eyebrow {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.45);
            margin-bottom: 12px;
        }

        .hero-name {
            font-size: clamp(52px, 6vw, 80px);
            font-weight: 700;
            margin: 0 0 10px 0;
            line-height: 1;
            letter-spacing: -0.02em;
        }

        .hero-stats {
            display: flex;
            align-items: center;
            gap: 24px;
            margin-top: 18px;
        }

        .hero-stat {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .hero-stat-value {
            font-size: 20px;
            font-weight: 700;
            color: white;
            letter-spacing: -0.01em;
        }

        .hero-stat-label {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.35);
        }

        .hero-stat-divider {
            width: 1px;
            height: 32px;
            background: rgba(255,255,255,0.15);
        }

        /* Play button — bottom left, above content */
        .hero-play {
            width: 52px;
            height: 52px;
            background: white;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            color: black;
            margin-bottom: 28px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 6px 20px rgba(0,0,0,0.5);
        }

        .hero-play:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 28px rgba(255,255,255,0.2);
        }

        /* ══════════════════════════════════════
           POPULAR — ranked list w/ view counts
        ══════════════════════════════════════ */
        .popular-list { display: flex; flex-direction: column; margin-bottom: 8px; }

        .popular-row {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .popular-row:hover { background: rgba(255,255,255,0.05); }

        .popular-rank {
            width: 22px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            color: rgba(255,255,255,0.35);
            flex-shrink: 0;
        }

        .popular-thumb {
            width: 46px;
            height: 46px;
            border-radius: 6px;
            overflow: hidden;
            flex-shrink: 0;
            background: #1a1a1a;
        }

        .popular-thumb img { width: 100%; height: 100%; object-fit: cover; }

        .popular-info { flex: 1; min-width: 0; }

        .popular-title {
            font-size: 14px;
            font-weight: 500;
            color: white;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .popular-sub {
            font-size: 12px;
            color: rgba(255,255,255,0.35);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .popular-views {
            font-size: 13px;
            color: rgba(255,255,255,0.45);
            flex-shrink: 0;
            font-variant-numeric: tabular-nums;
        }

        /* ══════════════════════════════════════
           DISCOGRAPHY — tabbed rows (Spotify-style)
        ══════════════════════════════════════ */
        .discog-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 4px;
        }

        .discog-title { font-size: 22px; font-weight: 700; color: rgba(255,255,255,0.95); letter-spacing: -0.01em; margin: 0; }

        .discog-show-all {
            font-size: 13px;
            font-weight: 500;
            color: rgba(255,255,255,0.45);
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .discog-show-all:hover { color: white; }

        .discog-tabs {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 18px 0 6px;
            flex-wrap: wrap;
        }

        .discog-tab {
            padding: 8px 18px;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.05);
            color: rgba(255,255,255,0.6);
            font-size: 13px;
            font-weight: 500;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .discog-tab:hover  { background: rgba(255,255,255,0.1); color: white; }
        .discog-tab.active { background: white; color: black; border-color: white; }

        .discog-track {
            display: flex;
            gap: 18px;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 22px 4px 28px;
            scrollbar-width: none;
        }

        .discog-track::-webkit-scrollbar { display: none; }

        /* square cover cards — reviews.html inspired */
        .discog-card {
            min-width: 180px;
            width: 180px;
            flex-shrink: 0;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .discog-card:hover { transform: translateY(-3px); }
        .discog-card:hover .discog-cover { box-shadow: 0 12px 30px rgba(0,0,0,0.6); }

        .discog-cover {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 10px;
            overflow: hidden;
            background: #1a1a1a;
            position: relative;
            margin-bottom: 12px;
            transition: box-shadow 0.2s ease;
            border: 1px solid rgba(255,255,255,0.06);
        }

        .discog-cover img { width: 100%; height: 100%; object-fit: cover; }

        .discog-cover-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(0,0,0,0.7);
            color: rgba(255,255,255,0.7);
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.15);
        }

        .discog-card-title {
            font-size: 14px;
            font-weight: 600;
            color: white;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .discog-card-sub {
            font-size: 12px;
            color: rgba(255,255,255,0.35);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ══════════════════════════════════════
           MAIN CONTENT AREA
        ══════════════════════════════════════ */
        .main {
            padding: 0 72px 72px;
            background: #080808;
        }

        /* ── SECTION LABEL (matches reviews style) ── */
        .section-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.25);
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-label::before {
            content: "";
            display: inline-block;
            width: 3px;
            height: 13px;
            background: white;
            border-radius: 2px;
            opacity: 0.3;
        }

    </style>
</head>

<body>

<header class="navbar">
    <div class="logo">
        <a href="index.html">
            <img src="logo-big-tran.png" alt="Logo">
        </a>
    </div>

    <ul class="nav-center">
        <li><a href="home.html">HOME</a></li>
        <li><a href="releases.html">RELEASES</a></li>
        <li><a href="announcements.html">ANNOUNCEMENTS</a></li>
        <li><a href="watch.html">WATCH & RATINGS</a></li>
        <li><a href="reviews.html">REVIEWS</a></li>
    </ul>
</header>

<!-- ══════ HERO ══════ -->
<section class="hero">
    <img class="hero-img" src="GurrajGrewal.png" alt="">
    <div class="hero-overlay"></div>

    <div class="hero-content">
        <div class="hero-eyebrow">Creator · Filmmaker</div>
        <h1 class="hero-name">Gurraj Grewal</h1>

        <div class="hero-stats">
            <div class="hero-stat">
                <span class="hero-stat-value">637,052</span>
                <span class="hero-stat-label">Lifetime Views</span>
            </div>
            <div class="hero-stat-divider"></div>
            <div class="hero-stat">
                <span class="hero-stat-value">3</span>
                <span class="hero-stat-label">Series</span>
            </div>
            <div class="hero-stat-divider"></div>
            <div class="hero-stat">
                <span class="hero-stat-value">2025</span>
                <span class="hero-stat-label">Latest Release</span>
            </div>
        </div>
    </div>
</section>

<!-- ══════ MAIN ══════ -->
<section class="main">

    <!-- POPULAR -->
    <div class="popular-section">
        <div class="section-label">Popular</div>
        <div class="popular-list" id="popularList"></div>
    </div>

    <!-- DISCOGRAPHY -->
    <div class="discog-section">
        <div class="discog-header">
            <h2 class="discog-title">Discography</h2>
            <span class="discog-show-all" onclick="window.location.href='releases.html'">Show all</span>
        </div>

        <div class="discog-tabs">
            <button class="discog-tab active" data-tab="popular" onclick="setDiscogTab('popular')">Popular</button>
            <button class="discog-tab" data-tab="projects" onclick="setDiscogTab('projects')">Projects</button>
        </div>

        <div class="discog-track" id="discogTrack"></div>
    </div>

</section>

<script>

/* ══════════════════════════════════════════════════════════
   CATALOG — one source of truth for Popular + Discography.

   Update `views` by hand whenever you check YouTube — that's
   it, no build step, no fetch. Leave `views: null` for anything
   too new/low to bother showing (renders as "—").
   ══════════════════════════════════════════════════════════ */
const catalog = [
    // ── PROJECTS (Album = Series / Movie) — Daytona excluded until released ──
    { kind: "project", format: "Series", title: "Hypixel Cinematic Montages: Anniversary",
      sub: "2025 · Series", cover: "HCMS3COVER.png",
      videoId: "v_4zKKeNzm0", link: { title: "hcm", season: 3 } },

    { kind: "project", format: "Series", title: "Hypixel Cinematic Montages: Pre-Party",
      sub: "2025 · Series", cover: "HCMS2COVER.png",
      videoId: "xJQcI7Pm-Dk", link: { title: "hcm", season: 2 } },

    { kind: "project", format: "Series", title: "Hypixel Cinematic Montages: Beginnings",
      sub: "2022 · Series", cover: "HCMS1COVER.png",
      videoId: "HmVeA0c8IHI", link: { title: "hcm", season: 1 } },

    // ── VIDEOS — the curated Popular list, in rank order ──
    { kind: "video", popularRank: 1, title: "GODZILLA — FE!N", subject: "Violethyst, Gurraj Grewal",
      year: 2024, views: 308204, cover: "GFE!N.png", videoId: "eymcrK50zng" },

    { kind: "video", popularRank: 2, title: "GODZILLA 2014—2024", subject: "Violethyst, Gurraj Grewal",
      year: 2023, views: 91443, cover: "G2014-2024.png", videoId: "NkTOKZ6co_c" },

    { kind: "video", popularRank: 3, title: "PLAYBOI CARTI — RATHER LIE", subject: "Violethyst, Gurraj Grewal",
      year: 2025, views: 1831, cover: "RATHERLIE.png", videoId: "HnDmrcyg7Fc" },

    { kind: "video", popularRank: 4, title: "PLAYBOI CARTI — TIMELESS", subject: "Violethyst, Gurraj Grewal",
      year: 2024, views: 29584, cover: "TIMELESS.png", videoId: "hImKEqjTf60" },

    { kind: "video", popularRank: 5, title: "The Daytona Full Cast Showcase", subject: "Gurraj Grewal",
      year: 2026, views: null, cover: "DCAST.png", videoId: null },

    { kind: "video", popularRank: 6, title: "The Daytona First Look Trailer", subject: "Gurraj Grewal",
      year: 2026, views: null, cover: "DFIRSTLOOK.png", videoId: null },

    { kind: "video", popularRank: 7, title: "KENDRICK LAMAR — TV OFF", subject: "Violethyst, Gurraj Grewal",
      year: 2025, views: 2290, cover: "TVOFF.png", videoId: "HlT9bi13VyY" },

    { kind: "video", popularRank: 8, title: "MIGUEL O'HARA — FLOOR 555", subject: "Violethyst, Gurraj Grewal",
      year: 2024, views: 1861, cover: "MFLOOR555.png", videoId: "GVAyQldzF8k" },

    { kind: "video", popularRank: 9, title: "MINECRAFT — MY EYES", subject: "Violethyst, Gurraj Grewal",
      year: 2024, views: 2430, cover: "MMYEYES.png", videoId: "7OXH39YJBCw" },

    { kind: "video", popularRank: 10, title: "GRAND THEFT AUTO V — PURPOSE IS GLORIOUS x MEMORY REBOOT", subject: "Violethyst, Gurraj Grewal",
      year: 2023, views: 4120, cover: "GTAVPIGxMR.png", videoId: "lRQb5q-hCeY" },

    // ── Not currently shown anywhere (not in the Popular ranking, and there's
    // no "Other Releases" tab anymore) — kept here in case you want them back.
        { kind: "video", popularRank: null, title: "MOON KNIGHT — FIELD TRIP", subject: "Violethyst, Gurraj Grewal",
      year: 2024, views: 1505, cover: "moonknight.png", videoId: "uKRpmThXs8Q" },
    
    { kind: "video", popularRank: null, title: "THE BATMAN — VAMPIRE HOUR", subject: "Violethyst, Gurraj Grewal",
      year: null, views: null, cover: "VAMPIREHOUR.png", videoId: "ejKw_q44txo" },

    { kind: "video", popularRank: null, title: "IRON MAN — NIGHTCRAWLER", subject: "Violethyst, Gurraj Grewal",
      year: null, views: null, cover: "NIGHTCRAWLER2.png", videoId: "hNQ0w4JYxlk" }

    // ── EPs (Playlist) go here once you have one, e.g.:
    // { kind: "playlist", format: "Playlist", title: "Playlist Name",
    //   subject: "", cover: "Thumb.png",
    //   link: { url: "https://www.youtube.com/playlist?list=XXXX" } }
];

function formatViews(n) {
    if (n === null || n === undefined) return "—";
    if (n < 1000) return String(n);
    if (n < 1000000) return Math.floor(n / 1000) + "K";
    return Math.floor(n / 1000000) + "M";
}

function goToItem(item) {
    if (item.kind === "project") {
        const p = new URLSearchParams({ title: item.link.title });
        if (item.link.season) p.set("season", item.link.season);
        window.location.href = `releases.html?${p.toString()}`;
    } else if (item.kind === "playlist") {
        window.open(item.link.url, "_blank", "noopener");
    } else if (item.videoId) {
        window.open(`https://www.youtube.com/watch?v=${item.videoId}`, "_blank", "noopener");
    }
}

/* ══════════════════════════════════════════════════════════
   POPULAR — curated ranking, videos only (no series here)
   ══════════════════════════════════════════════════════════ */
function renderPopular() {
    const list = document.getElementById("popularList");
    const ranked = catalog
        .filter(i => i.kind === "video" && i.popularRank)
        .sort((a, b) => a.popularRank - b.popularRank);

    list.innerHTML = ranked.map(item => `
        <div class="popular-row">
            <span class="popular-rank">${item.popularRank}</span>
            <div class="popular-thumb"><img src="${item.cover}" alt=""></div>
            <div class="popular-info">
                <div class="popular-title">${item.title}</div>
                <div class="popular-sub">${item.subject}</div>
            </div>
            <span class="popular-views">${formatViews(item.views)}${item.year ? " · " + item.year : ""}</span>
        </div>
    `).join("");

    ranked.forEach((item, i) => {
        list.children[i].onclick = () => goToItem(item);
    });
}

/* ══════════════════════════════════════════════════════════
   DISCOGRAPHY — Popular / Projects
   ══════════════════════════════════════════════════════════ */
let currentDiscogTab = "popular";

function setDiscogTab(tab) {
    currentDiscogTab = tab;
    document.querySelectorAll(".discog-tab").forEach(t => t.classList.toggle("active", t.dataset.tab === tab));
    renderDiscography();
}

function renderDiscography() {
    const track = document.getElementById("discogTrack");
    const items = currentDiscogTab === "projects"
        ? catalog.filter(i => i.kind === "project")
        : catalog.filter(i => i.kind === "video" && i.popularRank).sort((a, b) => a.popularRank - b.popularRank);

    track.innerHTML = items.map(item => `
        <div class="discog-card">
            <div class="discog-cover">
                <img src="${item.cover}" alt="">
            </div>
            <div class="discog-card-title">${item.title}</div>
            <div class="discog-card-sub">${item.kind === "project" ? item.sub : item.subject}</div>
        </div>
    `).join("");

    items.forEach((item, i) => {
        track.children[i].onclick = () => goToItem(item);
    });
}

/* ── INIT ── */
renderPopular();
renderDiscography();
</script>

</body>
</html>
