<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home - Gurraj Grewal</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon.png">

    <style>

        /* ── RESET ── */
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: #080808;
            color: white;
            overflow-x: hidden;
        }

        /* ── NAVBAR ── */
        .navbar {
            position: absolute;
            top: 0;
            width: 100%;
            z-index: 10;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .nav-center {
            display: flex;
            gap: 10px;
            list-style: none;
            margin: 0;
            padding: 10px 20px;
        }

        .nav-center li a {
            display: inline-block;
            padding: 10px 16px;
            border-radius: 999px;
            color: white;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .nav-center li a:hover { background: rgba(255,255,255,0.2); }
        .nav-center li a[href="home.html"] { background: rgba(255,255,255,0.3); }

        /* ══════════════════════════════════════
           HERO
        ══════════════════════════════════════ */
        .hero {
            position: relative;
            height: 90vh;
            min-height: 600px;
            overflow: hidden;
        }

        .hero-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
            transform: scale(1.05);
            animation: heroZoom 12s ease-out forwards;
        }

        @keyframes heroZoom {
            to { transform: scale(1); }
        }

        /* Rich layered gradient */
        .hero-overlay {
            position: absolute;
            inset: 0;
            background:
                linear-gradient(to top, #080808 0%, rgba(8,8,8,0.65) 30%, transparent 65%),
                linear-gradient(to right, rgba(8,8,8,0.5) 0%, transparent 50%);
        }

        .hero-content {
            position: absolute;
            bottom: 60px;
            left: 72px;
            z-index: 2;
        }

        .hero-eyebrow {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.45);
            margin-bottom: 12px;
        }

        .hero-name {
            font-size: clamp(52px, 6vw, 80px);
            font-weight: 700;
            margin: 0 0 10px 0;
            line-height: 1;
            letter-spacing: -0.02em;
        }

        .hero-stats {
            display: flex;
            align-items: center;
            gap: 24px;
            margin-top: 18px;
        }

        .hero-stat {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .hero-stat-value {
            font-size: 20px;
            font-weight: 700;
            color: white;
            letter-spacing: -0.01em;
        }

        .hero-stat-label {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.35);
        }

        .hero-stat-divider {
            width: 1px;
            height: 32px;
            background: rgba(255,255,255,0.15);
        }

        /* Play button — bottom left, above content */
        .hero-play {
            width: 52px;
            height: 52px;
            background: white;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            color: black;
            margin-bottom: 28px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 6px 20px rgba(0,0,0,0.5);
        }

        .hero-play:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 28px rgba(255,255,255,0.2);
        }

        /* ══════════════════════════════════════
           POPULAR — compact Spotify-style list
           Placeholder content for now
           ══════════════════════════════════════ */
        .popular-section { margin-bottom: 42px; }
        .popular-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
            margin-bottom: 8px;
        }
        .popular-row {
            display: grid;
            grid-template-columns: 32px 48px minmax(0, 1fr) 220px;
            align-items: center;
            gap: 14px;
            min-height: 64px;
            padding: 7px 12px;
            border-radius: 7px;
            transition: background .15s ease;
        }
        .popular-row.placeholder { cursor: default; }
        .popular-row:not(.placeholder) { cursor: pointer; }
        .popular-row:not(.placeholder):hover,
        .popular-row.placeholder:hover { background: rgba(255,255,255,.055); }
        .popular-rank {
            color: rgba(255,255,255,.32);
            font-size: 12px;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }
        .popular-thumb {
            width: 48px;
            height: 48px;
            border-radius: 5px;
            overflow: hidden;
            flex-shrink: 0;
            background: #181818;
            border: 1px solid rgba(255,255,255,.05);
            box-shadow: 0 5px 16px rgba(0,0,0,.25);
        }
        .popular-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .popular-info { min-width: 0; }
        .popular-title {
            font-size: 13px;
            font-weight: 500;
            color: rgba(255,255,255,.9);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .popular-sub {
            margin-top: 3px;
            font-size: 11px;
            color: rgba(255,255,255,.34);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .popular-artist {
            color: rgba(255,255,255,.42);
            font-size: 12px;
            text-align: right;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .popular-year-col {
            color: rgba(255,255,255,.3);
            font-size: 11px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }
        .popular-rating {
            min-width: 42px;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            text-align: center;
            font-variant-numeric: tabular-nums;
            box-shadow: 0 3px 8px rgba(0,0,0,.28);
        }

        .popular-row.placeholder { opacity: .74; }
        .popular-row.placeholder .popular-thumb { filter: grayscale(1); }
        .popular-row::after { content: ""; }
        @media (max-width: 820px) {
            .popular-row { grid-template-columns: 28px 44px minmax(0,1fr) 48px; gap: 11px; }
            .popular-artist { display: none; }
            .popular-thumb { width: 44px; height: 44px; }
        }

        /* ══════════════════════════════════════
           DISCOGRAPHY — tabbed rows (Spotify-style)
        ══════════════════════════════════════ */
        .discog-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 4px;
        }

        .discog-title { font-size: 22px; font-weight: 700; color: rgba(255,255,255,0.95); letter-spacing: -0.01em; margin: 0; }

        .discog-tabs {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 18px 0 6px;
            flex-wrap: wrap;
        }

        .discog-tab {
            padding: 8px 18px;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.05);
            color: rgba(255,255,255,0.6);
            font-size: 13px;
            font-weight: 500;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .discog-tab:hover  { background: rgba(255,255,255,0.1); color: white; }
        .discog-tab.active { background: white; color: black; border-color: white; }

        .discog-track {
            display: flex;
            gap: 18px;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 22px 4px 28px;
            scrollbar-width: none;
        }

        .discog-track::-webkit-scrollbar { display: none; }

        /* square cover cards — reviews.html inspired */
        .discog-card {
            min-width: 180px;
            width: 180px;
            flex-shrink: 0;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .discog-card:hover { transform: translateY(-3px); }
        .discog-card:hover .discog-cover { box-shadow: 0 12px 30px rgba(0,0,0,0.6); }
        .discog-card.discog-placeholder { cursor: default; opacity: .78; }
        .discog-card.discog-placeholder:hover { transform: none; }
        .discog-card.discog-placeholder:hover .discog-cover { box-shadow: none; }

        .discog-cover {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 10px;
            overflow: hidden;
            background: #1a1a1a;
            position: relative;
            margin-bottom: 12px;
            transition: box-shadow 0.2s ease;
            border: 1px solid rgba(255,255,255,0.06);
        }

        .discog-cover img { width: 100%; height: 100%; object-fit: cover; }

        .discog-cover-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(0,0,0,0.7);
            color: rgba(255,255,255,0.7);
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.15);
        }

        .discog-card-title {
            font-size: 14px;
            font-weight: 600;
            color: white;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .discog-card-sub {
            font-size: 12px;
            color: rgba(255,255,255,0.35);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ══════════════════════════════════════
           MAIN CONTENT AREA
        ══════════════════════════════════════ */
        .main {
            padding: 0 72px 72px;
            background: #080808;
        }

        /* ── SECTION LABEL (matches reviews style) ── */
        .section-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.25);
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-label::before {
            content: "";
            display: inline-block;
            width: 3px;
            height: 13px;
            background: white;
            border-radius: 2px;
            opacity: 0.3;
        }


        /* ══════════════════════════════════════
           SPOTIFY-STYLE PROJECT OVERLAY
           ══════════════════════════════════════ */
        body.project-overlay-open, body.film-overlay-open { overflow: hidden; }
        .film-overlay {
             position: fixed; inset: 0; z-index: 500; display: none;
             background: transparent;
             width: 100vw; height: 100vh;
             overflow: hidden;
        }
        .film-overlay.open { display: block; }
        .film-overlay iframe {
             position: absolute; inset: 0;
             width: 100%; height: 100%;
             border: 0; display: block;
             background: transparent;
        }
        .film-close {
            position: fixed; top: 18px; right: 22px; z-index: 510;
            width: 40px; height: 40px; border-radius: 50%;
            border: 1px solid rgba(255,255,255,.16);
            background: rgba(0,0,0,.45); color: rgba(255,255,255,.82);
            font: 500 18px 'Poppins', sans-serif; cursor: pointer;
            backdrop-filter: blur(10px); transition: .2s ease;
        }
        .film-close:hover { background: rgba(0,0,0,.68); color: white; transform: scale(1.05); }

        body.project-overlay-open { overflow: hidden; }
        .project-overlay {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: none;
            flex-direction: column;
            background: #0b0b0b;
            color: white;
            overflow-y: auto;
            animation: projectOverlayIn .24s ease both;
        }
        .project-overlay.open { display: flex; }
        @keyframes projectOverlayIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .project-overlay-topbar {
            position: sticky;
            top: 0;
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 18px 42px;
            background: rgba(11,11,11,.84);
            backdrop-filter: blur(18px);
            border-bottom: 1px solid rgba(255,255,255,.06);
        }
        .project-overlay-brand { font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: rgba(255,255,255,.38); }
        .project-overlay-actions { display: flex; align-items: center; gap: 10px; }
        .project-view-toggle, .project-close {
            border: 1px solid rgba(255,255,255,.13);
            background: rgba(255,255,255,.06);
            color: rgba(255,255,255,.8);
            border-radius: 999px;
            padding: 10px 16px;
            font: 500 12px 'Poppins', sans-serif;
            cursor: pointer;
            transition: .2s ease;
        }
        .project-view-toggle:hover, .project-close:hover { background: rgba(255,255,255,.13); color: white; }
        .project-overlay-main { width: min(1180px, calc(100% - 84px)); margin: 0 auto; padding: 62px 0 80px; }
        .project-overview { display: flex; align-items: end; gap: 34px; margin-bottom: 46px; }
        .project-cover { width: 245px; aspect-ratio: 1; object-fit: cover; border-radius: 8px; box-shadow: 0 22px 60px rgba(0,0,0,.45); flex-shrink: 0; }
        .project-eyebrow { color: rgba(255,255,255,.4); font-size: 11px; font-weight: 600; letter-spacing: .13em; text-transform: uppercase; margin-bottom: 12px; }
        .project-title { font-size: clamp(30px, 4vw, 58px); line-height: 1.04; letter-spacing: -.045em; margin: 0 0 16px; font-weight: 700; }
        .project-meta { color: rgba(255,255,255,.48); font-size: 13px; line-height: 1.7; }
        .project-play { margin-top: 25px; border: 0; background: white; color: black; border-radius: 999px; padding: 13px 25px; font: 700 13px 'Poppins', sans-serif; cursor: pointer; transition: transform .2s ease; }
        .project-play:hover { transform: scale(1.04); }
        .project-tabs { display: flex; gap: 8px; margin-bottom: 22px; border-bottom: 1px solid rgba(255,255,255,.08); padding-bottom: 13px; }
        .project-tab { border: 0; background: transparent; color: rgba(255,255,255,.4); padding: 8px 12px; border-radius: 6px; font: 600 13px 'Poppins', sans-serif; cursor: pointer; }
        .project-tab.active { color: white; background: rgba(255,255,255,.1); }
        .project-track-head, .project-track-row { display: grid; grid-template-columns: 42px minmax(0,1fr) 90px 60px; align-items: center; gap: 12px; }
        .project-track-head { padding: 0 14px 10px; color: rgba(255,255,255,.28); font-size: 10px; text-transform: uppercase; letter-spacing: .12em; }
        .project-track-row { min-height: 58px; padding: 7px 14px; border-radius: 7px; cursor: pointer; transition: background .15s ease; }
        .project-track-row:hover { background: rgba(255,255,255,.07); }
        .project-track-number { color: rgba(255,255,255,.32); font-size: 12px; text-align: center; }
        .project-track-title { color: rgba(255,255,255,.88); font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .project-track-sub { color: rgba(255,255,255,.3); font-size: 11px; margin-top: 2px; }
        .project-track-rating { justify-self: end; min-width: 43px; padding: 5px 7px; border-radius: 6px; text-align: center; font-size: 11px; font-weight: 700; }
        .project-track-duration { color: rgba(255,255,255,.35); font-size: 11px; text-align: right; font-variant-numeric: tabular-nums; }
        .project-empty { color: rgba(255,255,255,.3); font-size: 13px; padding: 25px 0; }
        @media (max-width: 700px) {
            .project-overlay-topbar { padding: 16px 20px; }
            .project-overlay-main { width: calc(100% - 40px); padding-top: 35px; }
            .project-overview { align-items: start; flex-direction: column; gap: 22px; }
            .project-cover { width: 185px; }
            .project-track-head, .project-track-row { grid-template-columns: 30px minmax(0,1fr) 48px; gap: 8px; }
            .project-track-duration { display: none; }
            .project-track-head { grid-template-columns: 30px minmax(0,1fr) 48px; }
            .project-track-row { padding: 8px 5px; }
            .project-view-toggle, .project-close { padding: 9px 11px; font-size: 11px; }
        }

    </style>
</head>

<body>

<header class="navbar">
    <div class="logo">
        <a href="index.html">
            <img src="logo-big-tran.png" alt="Logo">
        </a>
    </div>

    <ul class="nav-center">
        <li><a href="home.html">HOME</a></li>
        <li><a href="announcements.html">ANNOUNCEMENTS</a></li>
        <li><a href="reviews.html">REVIEWS</a></li>
    </ul>
</header>

<!-- ══════ HERO ══════ -->
<section class="hero">
    <img class="hero-img" src="GurrajGrewal2026.3.png" alt="">
    <div class="hero-overlay"></div>

    <div class="hero-content">
        <div class="hero-eyebrow">Creator · Filmmaker</div>
        <h1 class="hero-name">Gurraj Grewal</h1>

        <div class="hero-stats">
            <div class="hero-stat">
                <span class="hero-stat-value">637,052</span>
                <span class="hero-stat-label">Lifetime Views</span>
            </div>
            <div class="hero-stat-divider"></div>
            <div class="hero-stat">
                <span class="hero-stat-value">4</span>
                <span class="hero-stat-label">Projects</span>
            </div>
            <div class="hero-stat-divider"></div>
            <div class="hero-stat">
                <span class="hero-stat-value">2026</span>
                <span class="hero-stat-label">Latest Release</span>
            </div>
        </div>
    </div>
</section>

<!-- ══════ MAIN ══════ -->
<section class="main">

    <!-- POPULAR -->
    <div class="popular-section">
        <div class="section-label">Popular</div>
        <div class="popular-list" id="popularList"></div>
    </div>

    <!-- DISCOGRAPHY -->
    <div class="discog-section">
        <div class="discog-header">
            <h2 class="discog-title">Releases</h2>
        </div>

        <div class="discog-tabs">
            <button class="discog-tab active" data-tab="popular" onclick="setDiscogTab('popular')">Popular</button>
            <button class="discog-tab" data-tab="projects" onclick="setDiscogTab('projects')">Projects</button>
            <button class="discog-tab" data-tab="compilations" onclick="setDiscogTab('compilations')">Compilations</button>
        </div>

        <div class="discog-track" id="discogTrack"></div>
    </div>

</section>


<!-- Spotify-inspired project view -->
<div class="project-overlay" id="projectOverlay" aria-hidden="true">
    <div class="project-overlay-topbar">
        <div class="project-overlay-brand">Gurraj Grewal · Releases</div>
        <div class="project-overlay-actions">
            <button class="project-close" id="projectClose" type="button" aria-label="Close project view">✕</button>
        </div>
    </div>
    <main class="project-overlay-main">
        <section class="project-overview">
            <img class="project-cover" id="projectCover" src="black.png" alt="">
            <div>
                <div class="project-eyebrow" id="projectType">Montages</div>
                <h2 class="project-title" id="projectTitle">Project</h2>
                <div class="project-meta" id="projectMeta"></div>
                <button class="project-play" id="projectPlay" type="button">Immerse</button>
            </div>
        </section>
        <div class="project-tabs" id="projectTabs"></div>
        <div class="project-track-head"><span>#</span><span>Title</span><span style="text-align:right">Rating</span><span style="text-align:right">↗</span></div>
        <div id="projectTracks"></div>
    </main>
</div>

<!-- Full-screen Immerse overlay; each project is rendered as its own dedicated page. -->
<div class="film-overlay" id="filmOverlay" aria-hidden="true">
    <button class="film-close" id="filmClose" type="button" aria-label="Close Immersive Experience">✕</button>
    <iframe id="filmFrame" title="Immerse" allow="autoplay; fullscreen"></iframe>
</div>

<script>

/* ══════════════════════════════════════════════════════════
   CATALOG — one source of truth for Popular + Discography.

   Update `views` by hand whenever you check YouTube — that's
   it, no build step, no fetch. Leave `views: null` for anything
   too new/low to bother showing (renders as "—").
   ══════════════════════════════════════════════════════════ */
const catalog = [
    // ── PROJECTS — latest release first ──
    { kind: "project", format: "Series", popularRank: null, ratingRank: null, rating: null, title: "Daytona",
      sub: "2026 · Series", cover: "DAYTONACOVER.png", subject: "Gurraj Grewal", year: 2026,
      videoId: "u7msMYh8Yyk", link: { title: "daytona", slide: 1 } },

    { kind: "project", format: "Montages", popularRank: 4, ratingRank: 2, rating: 5.9, title: "Hypixel Cinematic Montages: Anniversary",
      sub: "2025 · Montages", cover: "HCMACOVER.png", subject: "Gurraj Grewal, Quadeca, SZA, JID, Kanye West, Ty Dolla $ign", year: 2025,
      videoId: "v_4zKKeNzm0", link: { title: "hcm", season: 3 } },

    { kind: "project", format: "Montages", popularRank: 2, ratingRank: 3, rating: 5.5, title: "Pre-Party",
      sub: "2025 · Montages", cover: "PRE-PARTYCOVER.png", subject: "Gurraj Grewal, The Weeknd, Travis Scott, Florence + The Machine", year: 2025,
      videoId: "xJQcI7Pm-Dk", link: { title: "hcm", season: 2 } },

    { kind: "project", format: "Montages", popularRank: 3, ratingRank: 1, rating: 6.2, title: "Hypixel Cinematic Montages: Beginnings",
      sub: "2022 · Montages", cover: "HCMBCOVER.png", subject: "Gurraj Grewal, Quadeca, Throttle, Dion Timmer, Travis Scott, Juice WRLD, Metro Boomin, Future, The Weeknd", year: 2022,
      videoId: "HmVeA0c8IHI", link: { title: "hcm", season: 1 } },

    // ── COMPILATIONS ──
    { kind: "compilation", format: "Compilation", title: "Daytona: Teasers & Trailers",
      subject: "Gurraj Grewal", year: 2026, cover: "DCAST.png", videoId: null, placeholder: true, popularRank: 1, link: { url: "https://www.youtube.com/playlist?list=PLL2d-OATLvpa3aNDuSt-noaBWX4NEmnne" } },

function formatViews(n) {
    if (n === null || n === undefined) return "—";
    if (n < 1000) return String(n);
    if (n < 1000000) return Math.floor(n / 1000) + "K";
    return Math.floor(n / 1000000) + "M";
}

function goToItem(item) {
    if (item.kind === "project") {
        openProjectOverlay(item);
    } else if (item.kind === "playlist" || item.kind === "compilation") {
        if (item.link?.url) window.open(item.link.url, "_blank", "noopener");
    } else if (item.videoId) {
        window.open(`https://www.youtube.com/watch?v=${item.videoId}`, "_blank", "noopener");
    }
}

function renderPopular() {
    const list = document.getElementById("popularList");
    const ranked = catalog
        .filter(i => Number.isFinite(i.popularRank))
        .sort((a, b) => a.popularRank - b.popularRank)
        .slice(0, 10);

    list.innerHTML = ranked.map(item => `
        <div class="popular-row" role="button" tabindex="0">
            <span class="popular-rank">${item.popularRank}</span>
            <div class="popular-thumb"><img src="${item.cover || 'black.png'}" alt=""></div>
            <div class="popular-info">
                <div class="popular-title">${item.title}</div>
                <div class="popular-sub">${item.format || (item.kind === 'compilation' ? 'Compilation' : 'Montages')} · ${item.year || '—'}</div>
            </div>
            <div class="popular-artist">${item.subject || 'Gurraj Grewal'}</div>
        </div>`
    ).join("");

    ranked.forEach((item, i) => {
        const row = list.children[i];
        row.onclick = () => goToItem(item);
        row.onkeydown = e => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                goToItem(item);
            }
        };
    });
}

const projectOverlay = document.getElementById('projectOverlay');
const projectTabs = document.getElementById('projectTabs');
const projectTracks = document.getElementById('projectTracks');
let activeProject = null;
let activeProjectPart = null;
let activeProjectIsAnniversary = false;

const projectParts = {
    hcm_s1: { label: 'Beginnings', key: 'hcm_s1', cover: 'HCMBCOVER.png', year: '2022' },
    hcm_s2: { label: 'Anniversary', key: 'hcm_s2', cover: 'HCMACOVER.png', year: '2025' },
    pre: { label: 'Pre-Party', key: 'pre', cover: 'PRE-PARTYCOVER.png', year: '2025' },
    daytona: { label: 'Daytona', key: 'daytona', cover: 'DAYTONACOVER.png', year: '2026' }
};

function projectScoreColor(score) {
    if (score === null || score === undefined || !score) return '#222';
    if (score < 5) return '#8e0808';
    if (score < 6) return '#bf6205';
    if (score < 7.6) return '#cea502';
    if (score < 8) return '#0aad1d';
    if (score < 9) return '#0b911b';
    if (score < 9.5) return '#008430';
    return '#00b1d1';
}
function projectScoreText(score) { return score >= 5 && score < 9 ? '#0f0f0f' : 'white'; }
function projectEpisodeLabel(key, index) {
    const hasPrologue = key === 'hcm_s1' || key === 'pre';
    return hasPrologue && index === 0 ? 'P' : `M${hasPrologue ? index : index + 1}`;
}
function projectPartForItem(item) {
    if (item.link && item.link.title === 'hcm' && item.link.season === 3) return 'anniversary';
    if (item.link && item.link.title === 'hcm' && item.link.season === 1) return 'beginnings';
    if (item.link && item.link.title === 'hcm' && item.link.season === 2) return 'pre';
    if (item.link && item.link.title === 'daytona') return 'daytona';
    return null;
}
function openProjectOverlay(item) {
    const part = projectPartForItem(item);
    if (!part) return;
    activeProject = item;
    activeProjectIsAnniversary = part === 'anniversary';
    activeProjectPart = part === 'anniversary' ? 'anniversary' : part;
    projectOverlay.classList.add('open');
    projectOverlay.setAttribute('aria-hidden', 'false');
    document.body.classList.add('project-overlay-open');
    document.getElementById('projectClose').onclick = closeProjectOverlay;
    renderProjectView();
}
function closeProjectOverlay() {
    projectOverlay.classList.remove('open');
    projectOverlay.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('project-overlay-open');
}
function renderProjectView() {
    const isAnniversary = activeProjectIsAnniversary;
    const key = activeProjectPart === 'beginnings' ? 'hcm_s1'
        : activeProjectPart === 'pre' ? 'pre'
        : activeProjectPart === 'daytona' ? 'daytona'
        : 'hcm_s2';
    const part = projectParts[key];
    const eps = episodeData[key] || [];
    const isDaytona = activeProjectPart === 'daytona';

    document.getElementById('projectCover').src = part.cover;
    document.getElementById('projectTitle').textContent =
        isAnniversary ? 'Hypixel Cinematic Montages: Anniversary' :
        key === 'hcm_s1' ? 'Hypixel Cinematic Montages: Beginnings' :
        key === 'pre' ? 'Pre-Party' : 'Daytona';
    document.getElementById('projectType').textContent = isDaytona ? 'Series' : 'Montages';

    const meta = isAnniversary
        ? 'Gurraj Grewal, Quadeca, SZA, JID, Kanye West, Ty Dolla $ign · 2025 · 13 Montages, 41 min 36 sec'
        : key === 'hcm_s1'
            ? 'Gurraj Grewal, Quadeca, Throttle, Dion Timmer, Travis Scott, Juice WRLD, Metro Boomin, Future, The Weeknd · 2022 · 10 Montages, 35 min 24 sec'
            : key === 'pre'
                ? 'Gurraj Grewal, The Weeknd, Travis Scott, Florence + The Machine · 2025 · 6 Montages, 22 min 29 sec'
                : 'Gurraj Grewal, Violethyst+ · 2026 · 9 Episodes · The Finale';
    document.getElementById('projectMeta').textContent = meta;
    document.getElementById('projectPlay').onclick = () => openFilmOverlay(activeProject, activeProjectPart);

    projectTabs.innerHTML = '';
    projectTabs.style.display = 'none';

    const sections = isAnniversary
        ? [{ label: 'Beginnings', key: 'hcm_s1' }, { label: 'Anniversary', key: 'hcm_s2' }]
        : [{ label: isDaytona ? 'The Finale' : key === 'pre' ? 'Pre-Party' : 'Beginnings', key }];

    projectTracks.innerHTML = sections.map(section => {
        const sectionEps = episodeData[section.key] || [];
        const sectionScores = episodeRatings[section.key] || [];
        const rows = sectionEps.map((ep, i) => {
            const score = sectionScores[i];
            const rating = score ? `<span class="project-track-rating" style="background:${projectScoreColor(score)};color:${projectScoreText(score)}">${Number(score).toFixed(1)}</span>` : '<span class="project-track-rating" style="background:#222;color:#555">—</span>';
            const label = isDaytona ? `E${i + 1}` : projectEpisodeLabel(section.key, i);
            return `<div class="project-track-row" data-key="${section.key}" data-index="${i}" role="button" tabindex="0">
                <span class="project-track-number">${label}</span>
                <span><div class="project-track-title">${ep.title}</div><div class="project-track-sub">${(episodeArtists[section.key] || [])[i] || (isDaytona ? "Gurraj Grewal, Violethyst+" : "Gurraj Grewal")}</div></span>
                ${rating}
                <span class="project-track-duration">↗</span>
            </div>`;
        }).join('');
        return `<section class="project-track-section"><h3 style="font-size:16px;margin:28px 0 10px;font-weight:600;color:rgba(255,255,255,.86)">${section.label}</h3>${rows}</section>`;
    }).join('');

    projectTracks.querySelectorAll('.project-track-row').forEach(row => {
        const rowKey = row.dataset.key;
        const index = Number(row.dataset.index);
        const url = (videoLinks[rowKey] || [])[index];
        const open = () => { if (url) window.open(url.replace('/embed/', '/watch?v='), '_blank', 'noopener'); };
        row.onclick = open;
        row.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } };
    });
}

function openFilmOverlay(item, forcedPart = null) {
    const part = forcedPart || projectPartForItem(item);
    if (!part) return;

    filmOverlay.classList.add('open');
    document.body.classList.add('film-overlay-open');

    // Each project gets its own dedicated immersion page.
    // There is no shared HCM season state anymore.
    const filmPage = FILM_PAGE_HTML.replace(/__FILM_PROJECT_KEY__/g, part);
    filmFrame.srcdoc = filmPage;
}

function closeFilmOverlay() {
    filmFrame.srcdoc = '';
    delete filmFrame.dataset.kind;
    delete filmFrame.dataset.slide;
    delete filmFrame.dataset.season;
    filmOverlay.classList.remove('open');
    document.body.classList.remove('film-overlay-open');
}

filmClose.addEventListener('click', closeFilmOverlay);

window.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (filmOverlay.classList.contains('open')) { closeFilmOverlay(); return; }
    if (projectOverlay.classList.contains('open')) closeProjectOverlay();
});

</script>
