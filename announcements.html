<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Announcements - Gurraj Grewal</title>

    <!-- SAME FONT AS HOME -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="icon" type="image/png" href="favicon.png">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: black;
            color: white;
        }

        /* BACKGROUND IMAGE */
        .bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: url('Announcements.png') center/cover no-repeat;
            z-index: -1;
        }
    </style>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="bg"></div>

<header class="site-header">
    <div class="site-brand">
        <button class="menu-toggle" id="menuToggle" type="button" aria-label="Open navigation" aria-controls="siteNavDrawer" aria-expanded="false">
            <span></span><span></span>
        </button>
    </div>
</header>
<div class="nav-scrim" id="navScrim" aria-hidden="true"></div>
<aside class="nav-drawer" id="siteNavDrawer" aria-hidden="true" aria-label="Main navigation">
    <div class="nav-drawer-head">
        <span class="nav-drawer-kicker">EXPLORE</span>
        <button class="nav-drawer-close" id="navDrawerClose" type="button" aria-label="Close navigation">×</button>
    </div>
    <nav class="nav-drawer-links">
        <a href="home.html" data-nav-page="home.html">HOME <span>01</span></a>
        <a href="announcements.html" data-nav-page="announcements.html">ANNOUNCEMENTS <span>02</span></a>
        <a href="reviews.html" data-nav-page="reviews.html">REVIEWS <span>03</span></a>
    </nav>
    <div class="nav-drawer-foot"><span>GURRAJ GREWAL</span><span>CREATOR · FILMMAKER</span></div>
</aside>

<script>
(() => {
    const toggle = document.getElementById('menuToggle');
    const drawer = document.getElementById('siteNavDrawer');
    const close = document.getElementById('navDrawerClose');
    const scrim = document.getElementById('navScrim');
    if (!toggle || !drawer || !close || !scrim) return;

    const currentPage = location.pathname.split('/').pop() || 'home.html';
    drawer.querySelectorAll('[data-nav-page]').forEach(link => {
        if (link.dataset.navPage === currentPage) link.setAttribute('aria-current', 'page');
    });

    function setNavigationOpen(open) {
        toggle.setAttribute('aria-expanded', String(open));
        toggle.setAttribute('aria-label', open ? 'Close navigation' : 'Open navigation');
        drawer.classList.toggle('is-open', open);
        scrim.classList.toggle('is-open', open);
        drawer.setAttribute('aria-hidden', String(!open));
        scrim.setAttribute('aria-hidden', String(!open));
        document.body.classList.toggle('nav-open', open);
    }
    toggle.addEventListener('click', () => setNavigationOpen(toggle.getAttribute('aria-expanded') !== 'true'));
    close.addEventListener('click', () => setNavigationOpen(false));
    scrim.addEventListener('click', () => setNavigationOpen(false));
    document.addEventListener('keydown', event => {
        if (event.key === 'Escape' && drawer.classList.contains('is-open')) {
            setNavigationOpen(false);
            toggle.focus();
        }
    });
})();
</script>
</body>
</html>
